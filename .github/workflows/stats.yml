name: Update profile stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Rendered here rather than hotlinked from github-readme-stats.vercel.app:
      # the shared instance answers 503 under load, which would leave two broken
      # images sitting on the profile.
      - name: Render stat cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 profile/render.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && { echo "cards unchanged"; exit 0; }
          git commit -m "chore: update profile stats"
          git push
